<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>1+1 Discount % Calculator</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 24px; background:#f6f7f9; }
    .card { max-width: 520px; margin: 0 auto; background:#fff; border-radius: 14px; padding: 18px; box-shadow: 0 6px 22px rgba(0,0,0,.08); }
    h1 { font-size: 18px; margin: 0 0 10px; }
    p { margin: 6px 0 14px; color:#444; }
    .row { display:flex; gap:12px; flex-wrap: wrap; }
    .field { flex: 1 1 220px; }
    label { display:block; font-size: 12px; margin: 10px 0 6px; color:#333; }
    input { width: 100%; font-size: 18px; padding: 12px; border: 1px solid #d7dbe2; border-radius: 12px; outline: none; }
    input:focus { border-color:#7aa7ff; box-shadow: 0 0 0 3px rgba(122,167,255,.25); }
    .result { margin-top: 14px; padding: 14px; border-radius: 12px; background:#f1f6ff; border:1px solid #d8e6ff; }
    .big { font-size: 34px; font-weight: 800; letter-spacing: .2px; }
    .muted { color:#465; font-size: 13px; margin-top: 6px; }
    .warn { margin-top: 10px; color:#9a3b00; background:#fff3e8; border:1px solid #ffd6b8; padding: 10px 12px; border-radius: 12px; font-size: 13px; }
    button { margin-top: 12px; width: 100%; padding: 12px; font-size: 16px; border:0; border-radius: 12px; background:#111827; color:#fff; cursor:pointer; }
    button:active { transform: translateY(1px); }
    .tiny { font-size: 12px; color:#666; margin-top: 10px; }
    .lang { font-size: 12px; color:#666; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>1+1 Discount % Calculator</h1>
    <p>Enter two prices. It returns the <b>% discount to apply to the higher-priced item</b> (rounded down).</p>

    <div class="row">
      <div class="field">
        <label>Large price (AZN)</label>
        <input id="large" inputmode="decimal" placeholder="e.g., 1000" />
      </div>
      <div class="field">
        <label>Small price (AZN)</label>
        <input id="small" inputmode="decimal" placeholder="e.g., 100" />
      </div>
    </div>

    <div id="warn" class="warn" style="display:none;"></div>

    <div class="result">
      <div class="big" id="pct">—</div>
      <div class="muted" id="instruction">Enter prices to see the discount %.</div>
      <div class="lang" id="ru"></div>
      <div class="lang" id="az"></div>
    </div>

    <button id="clearBtn" type="button">Clear</button>
    <div class="tiny">
      Rule: Discount % = (cheaper ÷ expensive) × 100. Applied to the expensive item only.
    </div>
  </div>

  <script>
    const largeEl = document.getElementById('large');
    const smallEl = document.getElementById('small');
    const pctEl = document.getElementById('pct');
    const instEl = document.getElementById('instruction');
    const warnEl = document.getElementById('warn');
    const ruEl = document.getElementById('ru');
    const azEl = document.getElementById('az');
    const clearBtn = document.getElementById('clearBtn');

    function toNumber(x) {
      // Allow commas as decimal separators
      if (typeof x !== 'string') return NaN;
      x = x.trim().replace(',', '.');
      // Remove spaces
      x = x.replace(/\s+/g, '');
      return Number(x);
    }

    function roundDown(value, decimals) {
      const factor = Math.pow(10, decimals);
      return Math.floor(value * factor) / factor;
    }

    function formatPercent(x) {
      // show 1 decimal, but if .0 then hide decimals
      const s = x.toFixed(1);
      return s.endsWith('.0') ? s.slice(0, -2) + '%' : s + '%';
    }

    function calculate() {
      warnEl.style.display = 'none';
      warnEl.textContent = '';

      const a = toNumber(largeEl.value);
      const b = toNumber(smallEl.value);

      if (!a || !b || isNaN(a) || isNaN(b)) {
        pctEl.textContent = '—';
        instEl.textContent = 'Enter prices to see the discount %.';
        ruEl.textContent = '';
        azEl.textContent = '';
        return;
      }

      if (a <= 0 || b <= 0) {
        warnEl.style.display = 'block';
        warnEl.textContent = 'Please enter positive numbers only.';
        pctEl.textContent = '—';
        instEl.textContent = 'Enter valid prices.';
        ruEl.textContent = '';
        azEl.textContent = '';
        return;
      }

      const high = Math.max(a, b);
      const low = Math.min(a, b);

      // If staff accidentally typed "large" smaller than "small", we still compute correctly.
      if (a !== high) {
        warnEl.style.display = 'block';
        warnEl.textContent = 'Note: You entered a smaller number in “Large price”. I corrected it automatically.';
      }

      // Discount % to apply on higher-priced item:
      // (low/high)*100, rounded down to 1 decimal
      let pct = (low / high) * 100;
      pct = Math.min(100, Math.max(0, pct));
      pct = roundDown(pct, 1);

      pctEl.textContent = formatPercent(pct);

      instEl.textContent = `Apply ${formatPercent(pct)} discount to the higher-priced item (${high} AZN). The lower-priced item (${low} AZN) stays full price.`;

      // RU + AZ staff scripts (optional but helpful)
      ruEl.textContent = `RU: Поставьте скидку ${formatPercent(pct)} на более дорогой товар (${high} AZN). Более дешёвый (${low} AZN) — без скидки.`;
      azEl.textContent = `AZ: ${formatPercent(pct)} endirimi daha bahalı məhsula (${high} AZN) tətbiq edin. Daha ucuz məhsul (${low} AZN) endirimsiz qalır.`;
    }

    largeEl.addEventListener('input', calculate);
    smallEl.addEventListener('input', calculate);

    clearBtn.addEventListener('click', () => {
      largeEl.value = '';
      smallEl.value = '';
      warnEl.style.display = 'none';
      pctEl.textContent = '—';
      instEl.textContent = 'Enter prices to see the discount %.';
      ruEl.textContent = '';
      azEl.textContent = '';
      largeEl.focus();
    });
  </script>
</body>
</html>
